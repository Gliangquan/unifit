spring:
  application:
    name: unifit-backend

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/unifit?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DATASOURCE_USERNAME:root}
    password: ${DATASOURCE_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

server:
  port: ${SERVER_PORT:9901}
  servlet:
    context-path: /api

logging:
  level:
    root: info
    com.jcen.unifit: debug
  file:
    name: logs/application.log

jwt:
  secret: ${JWT_SECRET:change-me}
  expiration: 86400000

wechat:
  app-id: ${WECHAT_APP_ID:}
  secret: ${WECHAT_SECRET:}
  login-url: https://api.weixin.qq.com/sns/jscode2session

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://127.0.0.1:9000}
  access-key: ${MINIO_ACCESS_KEY:change-me}
  secret-key: ${MINIO_SECRET_KEY:change-me}
  bucket: ${MINIO_BUCKET:unifit}
