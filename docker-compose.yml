services:
  unifit-backend:
    build:
      context: ./UniFit-backend
    container_name: unifit-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: ${SERVER_PORT:-19921}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3307/unifit?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-root}
      SPRING_REDIS_HOST: ${SPRING_REDIS_HOST:-host.docker.internal}
      SPRING_REDIS_PORT: ${SPRING_REDIS_PORT:-6379}
      SPRING_REDIS_PASSWORD: ${SPRING_REDIS_PASSWORD:-}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-host.docker.internal}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://107.148.176.142:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-unifit}
      JWT_SECRET: ${JWT_SECRET:-unifit-jwt-secret-please-change-in-production-2026-very-long}
    ports:
      - "19921:19921"
    networks:
      - unifit-net

  unifit-frontend:
    build:
      context: ./UniFit-frontend
      args:
        VITE_API_BASE_URL: ${FRONTEND_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${FRONTEND_WS_BASE_URL:-/ws}
    container_name: unifit-frontend
    restart: unless-stopped
    depends_on:
      - unifit-backend
    ports:
      - "19922:80"
    networks:
      - unifit-net

  unifit-uniapp-h5:
    build:
      context: ./UniFit_uniapp
      dockerfile: Dockerfile.h5
      args:
        VITE_UNI_BASE_URL: ${UNIAPP_BASE_URL:-/api}
    container_name: unifit-uniapp-h5
    restart: unless-stopped
    depends_on:
      - unifit-backend
    ports:
      - "19923:8080"
    networks:
      - unifit-net

networks:
  unifit-net:
    driver: bridge
