services:
  unifit-backend:
    build:
      context: ./UniFit-backend
    container_name: unifit-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 9020
      DATASOURCE_URL: jdbc:mysql://mysql:3306/unifit?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
      DATASOURCE_USERNAME: root
      DATASOURCE_PASSWORD: DjmIpJ2PdXs4H3Ju1JYIrfvZ
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://107.148.176.142:9000
      MINIO_ACCESS_KEY: AxBzQbS4wjH9R51b
      MINIO_SECRET_KEY: NNJxorLf4p7Zd1rdJAurEXgP
      MINIO_BUCKET: unifit
      JWT_SECRET: unifit-jwt-secret-please-change-in-production-2026-very-long
    ports:
      - "9020:9020"
    networks:
      - default
      - shared-infra

  unifit-frontend:
    build:
      context: ./UniFit-frontend
    container_name: unifit-frontend
    restart: unless-stopped
    depends_on:
      - unifit-backend
    ports:
      - "9021:80"
    networks:
      - default

  unifit-uniapp-h5:
    build:
      context: ./UniFit_uniapp
      dockerfile: Dockerfile.h5
    container_name: unifit-uniapp-h5
    restart: unless-stopped
    depends_on:
      - unifit-backend
    ports:
      - "9022:8080"
    networks:
      - default

networks:
  default:
    driver: bridge
  shared-infra:
    external: true
